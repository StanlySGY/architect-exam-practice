name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check (zero-dep lint)
        run: npm run lint
      - name: Learning-content audit
        run: npm run audit:learning-content
      - name: Learning verification backlog audit
        run: npm run audit:verification-queue
      - name: Tests
        run: npm test
