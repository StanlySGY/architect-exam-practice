name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Syntax check (zero-dep lint)
        run: npm run lint
      - name: Learning-content audit
        run: npm run audit:learning-content
      - name: Learning verification backlog audit
        run: npm run audit:verification-queue
      - name: Tests
        run: npm test
